<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الكروت الشخصية | سوشيالجي</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      min-height: 100vh;
    }

    header {
      padding: 50px 20px 20px;
    }

    header h1 {
      color: #38bdf8;
      font-size: 40px;
      margin-bottom: 10px;
    }

    header p {
      color: #d1d5db;
      font-size: 18px;
    }

    .filters {
      padding: 30px 20px;
    }

    .filter-btn {
      margin: 5px;
      padding: 12px 30px;
      border: 2px solid #38bdf8;
      background: transparent;
      color: #38bdf8;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #38bdf8;
      color: #111827;
    }

    .cards-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .design-card {
      background: #1f2937;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: 0.3s;
    }

    .design-card:hover {
      transform: translateY(-5px);
    }

    .design-card img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .design-card p {
      margin-top: 10px;
      color: #d1d5db;
    }

    /* Modal (الصورة المكبرة) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .whatsapp-btn {
      display: inline-block;
      padding: 14px 30px;
      background: #38bdf8;
      color: #111827;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

    .whatsapp-btn:hover {
      background: #0ea5e9;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      background: none;
      border: none;
    }

    .back-link {
      display: inline-block;
      margin: 20px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <header>
    <h1>الكروت الشخصية</h1>
    <p>اختر مجالك لعرض التصميمات</p>
    <a href="index.html" class="back-link">← الرجوع للصفحة الرئيسية</a>
  </header>

  <section class="filters">
    <button class="filter-btn active" data-category="cars">سيارات</button>
  </section>

  <section class="cards-gallery">
    <div class="design-card" data-category="cars" onclick="openModal('Car-1Front.jpg')">
      <img src="Car-1Front.jpg" alt="كارت سيارات وش">
      <p>كارت سيارات - الوش</p>
    </div>

    <div class="design-card" data-category="cars" onclick="openModal('Car-1Back.jpg')">
      <img src="Car-1Back.jpg" alt="كارت سيارات ضهر">
      <p>كارت سيارات - الضهر</p>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal" id="modal">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <img id="modalImg" src="" alt="تصميم">
    <a id="whatsappLink" class="whatsapp-btn" href="#" target="_blank">
      اطلب تصميمك الآن عبر واتساب
    </a>
  </div>

  <script>
    function openModal(imgSrc) {
      document.getElementById('modalImg').src = imgSrc;
      const msg = encodeURIComponent("السلام عليكم، أنا مهتم بطلب التصميم ده 👇\n" + window.location.origin + "/" + imgSrc);
      document.getElementById('whatsappLink').href = "https://wa.me/201037294979?text=" + msg;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
  </script>

</body>
</html>
